name: Event Article Generator

on:
  schedule:
    # Every 30 minutes, offset from the scan (:17,:47) and queue worker (:32)
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max events to write this run (use a larger number to backfill)'
        required: false
        default: '20'

concurrency:
  group: article-generation-worker
  cancel-in-progress: false

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Generate Event Articles
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_READER_API_KEY: ${{ secrets.JINA_READER_API_KEY }}
          ARTICLE_BATCH_LIMIT: ${{ github.event.inputs.limit || '20' }}
          NODE_OPTIONS: '--no-deprecation'
        run: |
          python collector/generate_articles.py
