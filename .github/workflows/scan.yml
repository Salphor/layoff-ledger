name: 30-Minute Ingestion Scan

# News only. WARN notices have their own workflow (warn_scan.yml), so this
# job finishes well inside its 15-minute limit.

on:
  schedule:
    # Runs every 30 minutes offset from the top/bottom of the hour (at :17 and :47)
    - cron: '17,47 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

# Prevent overlapping runs and cancel stuck runs if a new schedule triggers
concurrency:
  group: scan-pipeline
  cancel-in-progress: true

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevents jobs from hanging past 15 mins
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Execute Scan Pipeline
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_READER_API_KEY: ${{ secrets.JINA_READER_API_KEY }}
          NODE_OPTIONS: '--no-deprecation'
          SCAN_NEWS: '1'
          SCAN_WARN: '0'
          # Articles are trimmed to 1,200 characters, so 20 per request is small for
          # Gemini and doubles what the 20-requests-a-day free quota covers.
          GEMINI_BATCH_SIZE: '20'      # articles per Gemini request
          SOURCE_LIMIT: '60'           # articles per run (3 requests at most)
          RUN_BUDGET_SECONDS: '660'    # stop starting new work after 11 minutes
        run: |
          python collector/run_scan.py