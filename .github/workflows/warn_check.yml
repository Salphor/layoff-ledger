name: WARN Dry Run (no database)

# Runs automatically when the WARN code changes on a branch other than main, and
# can also be started by hand. It has NO database secrets, so it cannot change
# any data. Pushes test every supported state; a manual run can pick states.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'collector/adapters/state_warn.py'
      - 'collector/warn_fields.py'
      - 'collector/warn_check.py'
      - '.github/workflows/warn_check.yml'
  workflow_dispatch:
    inputs:
      states:
        description: 'States to test: "all", or a list like "ca,ny,wa,tx"'
        required: false
        default: 'all'
      since:
        description: 'Optional: count notices from this date on (YYYY-MM-DD), e.g. to size a history import'
        required: false
        default: ''

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
      - name: Scrape WARN notices (dry run)
        env:
          WARN_STATES: ${{ inputs.states || 'all' }}
          WARN_SINCE: ${{ inputs.since }}
        run: python collector/warn_check.py
