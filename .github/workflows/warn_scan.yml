name: WARN Notice Scan

# Downloads state WARN notices every 6 hours and saves new ones to the
# database. The hourly Event Processing Worker turns them into layoff events.
# Needs only the database secret: WARN notices never go through Gemini.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: warn-scan
  cancel-in-progress: false

jobs:
  warn-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Scan WARN Notices
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NODE_OPTIONS: '--no-deprecation'
          SCAN_NEWS: '0'
          SCAN_WARN: '1'
          RUN_BUDGET_SECONDS: '1500'
          SOURCE_LIMIT: '0'   # only save notices; the hourly worker processes them
          # 26 states that return data (checked Oct 2026). Not working yet,
          # because the warn-scraper library's scraper is broken or blocked:
          # CO DC FL HI ID IL MD MI MS ND NM OH RI TN TX (LA, MA need a paid proxy).
          # GA removed Oct 30, 2026: it only returns an old archive (nothing
          # since 2025), and its scraper sends a browser user agent.
          WARN_STATES: 'ak,al,az,ca,ct,de,ia,in,ks,ky,me,mo,mt,ne,nj,ny,ok,or,pa,sc,sd,ut,va,vt,wa,wi'
        run: |
          python collector/run_scan.py
